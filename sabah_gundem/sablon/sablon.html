<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-playfair-display-5.3.0/package/900.css">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-playfair-display-5.3.0/package/400-italic.css">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-inter-5.3.0/package/400.css">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-inter-5.3.0/package/500.css">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-inter-5.3.0/package/700.css">
<link rel="stylesheet" href="file:///tmp/fonts/fontsource-inter-5.3.0/package/800.css">
<style>
html,body{margin:0;padding:0}
#a{width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:#f2ede3;color:#151515;padding:84px 88px}
#a .mast{border-top:10px solid #151515;padding-top:22px;display:flex;justify-content:space-between;align-items:baseline}
#a .mast .t{font-family:'Inter';font-weight:800;font-size:30px;letter-spacing:6px}
#a .mast .d{font-family:'Inter';font-weight:500;font-size:22px;letter-spacing:3px;color:#6b665d}
#a .thin{border-top:2px solid #151515;margin-top:20px}
#a .tag{display:inline-block;margin-top:0;background:#b8322a;color:#fff;font-family:'Inter';font-weight:700;font-size:21px;letter-spacing:4px;padding:10px 18px}
#a .main{position:absolute;left:88px;right:88px;top:262px;bottom:420px}
#a h1{font-family:'Playfair Display';font-weight:900;font-size:96px;line-height:1.04;margin:34px 0 0;letter-spacing:-1px}
#a .dek{font-family:'Playfair Display';font-style:italic;font-size:36px;line-height:1.35;color:#3d3a35;margin-top:36px;max-width:860px}
#a .stats{position:absolute;left:88px;right:88px;bottom:190px;display:grid;grid-template-columns:1fr 1fr 1fr;border-top:2px solid #151515;border-bottom:2px solid #151515}
#a .stats>div{padding:30px 0 28px 28px;border-left:1px solid #b9b2a5}
#a .stats>div:first-child{border-left:none;padding-left:0}
#a .n{display:inline-block;font-family:'Playfair Display';font-weight:900;font-size:92px;line-height:1;color:#b8322a;white-space:nowrap}
#a .l{display:block;font-family:'Inter';font-weight:500;font-size:22px;letter-spacing:2px;color:#4a463f;margin-top:10px;text-transform:uppercase}
#a .foot{position:absolute;left:88px;right:88px;bottom:84px;display:flex;justify-content:space-between;font-family:'Inter';font-size:21px;color:#6b665d;letter-spacing:1px}
#a .foot b{font-weight:800;color:#151515;letter-spacing:4px}
#s{width:1080px;height:1920px;background:#f2ede3;padding-top:230px;box-sizing:border-box;position:relative}
#s .snote{position:absolute;left:88px;right:88px;bottom:250px;font-family:'Inter';font-weight:700;font-size:22px;letter-spacing:5px;color:#151515}
#s .snote .r{width:90px;height:4px;background:#b8322a;margin-bottom:22px}
</style></head><body>
<div id="s"><div id="a">
  <div class="mast"><div class="t">EDEBİYAT GÜNDEMİ</div><div class="d" id="tarih"></div></div>
  <div class="thin"></div>
  <div class="main">
    <div class="tag" id="etiket"></div>
    <h1 id="baslik"></h1>
    <div class="dek" id="ozet"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="foot"><span id="kaynak"></span><b>BLACKARTISTANBUL</b></div>
</div>
<div class="snote"><div class="r"></div>AYRINTILAR VE KAYNAKLAR GÖNDERİDE</div>
</div>
<script>
function render(d){
  for (const k of ["tarih","etiket","baslik","ozet","kaynak"]) document.getElementById(k).textContent = d[k] || "";
  const s = document.getElementById("stats");
  s.innerHTML = "";
  for (const [n,l] of d.rakamlar) {
    const c = document.createElement("div");
    c.innerHTML = '<div class="n"></div><div class="l"></div>';
    c.querySelector(".n").textContent = n; c.querySelector(".l").textContent = l;
    s.appendChild(c);
  }
  return true;
}
function fit(){
  const main = document.querySelector(".main"), h1 = document.getElementById("baslik"), dek = document.getElementById("ozet");
  let hs = 96, ds = 36; h1.style.fontSize = hs+"px"; dek.style.fontSize = ds+"px";
  while (main.scrollHeight > main.clientHeight + 1 && hs > 56) { hs -= 4; ds = Math.max(28, ds - 1); h1.style.fontSize = hs+"px"; dek.style.fontSize = ds+"px"; }
  document.querySelectorAll(".n").forEach(e => { let f = 92; e.style.fontSize = f+"px"; while (e.scrollWidth > e.parentElement.clientWidth - 30 && f > 48) { f -= 4; e.style.fontSize = f+"px"; } });
  return main.scrollHeight <= main.clientHeight + 1;
}
</script>
</body></html>
